<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Battery growth icon</title>
  <desc id="desc">A white battery outline with an upward trend arrow and four charge bars on a soft gray rounded background.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F7F8"/>
      <stop offset="1" stop-color="#E4E7EA"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#70777D" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#70777D" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="16" fill="url(#bg)"/>

  <g filter="url(#shadow)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Battery terminal -->
    <path d="M54 26V22.5A4.5 4.5 0 0 1 58.5 18h11A4.5 4.5 0 0 1 74 22.5V26" stroke-width="7"/>

    <!-- Battery body -->
    <rect x="39" y="27" width="50" height="79" rx="11" stroke-width="7"/>

    <!-- Growth arrow -->
    <path d="M49 52 59 42l8 8 13-14" stroke-width="6"/>
    <path d="M72.5 36.8 82 34l-1.9 9.7" stroke-width="6"/>
  </g>

  <!-- Charge bars -->
  <g fill="#FFFFFF" filter="url(#softShadow)">
    <rect x="48" y="61" width="32" height="8" rx="3.5"/>
    <rect x="48" y="73" width="32" height="8" rx="3.5"/>
    <rect x="48" y="85" width="32" height="8" rx="3.5"/>
    <rect x="48" y="97" width="32" height="8" rx="3.5"/>
  </g>

  <!-- Decorative sparkle -->
  <path d="M106 101c1.4 4 3.2 5.8 7.2 7.2-4 1.4-5.8 3.2-7.2 7.2-1.4-4-3.2-5.8-7.2-7.2 4-1.4 5.8-3.2 7.2-7.2Z" fill="#FFFFFF" opacity="0.58"/>
</svg>
